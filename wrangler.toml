name = "github-mcp"
main = "src/index.js"
compatibility_date = "2026-10-05"

workers_dev = false
preview_urls = false

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "1a64a2ae2ec14781bf78f30bed336e07"

# Optional settings (secrets are set with `wrangler secret put`, see README):
# [vars]
# ALLOWED_GITHUB_USERS = "your-login"     # comma-separated; empty = any GitHub account
# GITHUB_SCOPES = "repo read:org read:user user:email read:packages write:packages read:project project gist notifications workflow"
# MCP_LOCKDOWN = "true"                   # ask GitHub to hide public issue content from users without push access

# Rate limit for MCP API requests (keyed per GitHub user)
[[ratelimits]]
name = "MCP_RL"
namespace_id = "1001"
[ratelimits.simple]
limit = 60
period = 60

# Strict rate limit for OAuth client registration (DCR spam protection)
[[ratelimits]]
name = "REG_RL"
namespace_id = "1002"
[ratelimits.simple]
limit = 5
period = 60

# Daily KV sweep (expired grants / orphaned tokens)
[triggers]
crons = ["0 3 * * *"]
